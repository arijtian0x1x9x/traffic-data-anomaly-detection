name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.17'
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check src scripts tests
      - run: uv run pytest -q
      - run: uv run python scripts/check_notebooks.py
      - run: uv run python scripts/check_public_files.py
      - run: uv run traffic-study prepare
      - run: uv run traffic-study train
      - run: uv run traffic-study validate
