[project]
name = "traffic-anomaly"
version = "1.0.0"
description = "A reproducible traffic anomaly detection and reliability study"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "numpy>=2.2,<3", "pandas>=2.2,<4", "scikit-learn>=1.7,<2",
  "matplotlib>=3.10,<4", "joblib>=1.4,<2",
]
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12", "jupyterlab>=4,<5",
       "ipykernel>=6,<8", "nbformat>=5,<6", "nbclient>=0.10,<1"]
[project.scripts]
traffic-study = "traffic_anomaly.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/traffic_anomaly"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
